version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: automated_exam_system
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: sa
      MYSQL_USER: sa
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: sa
      PMA_PASSWORD: sa
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - laravel_network

  # Laravel Backend
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www:delegated
      - /var/www/vendor
      - /var/www/storage
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - laravel_network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: automated_exam_system
      DB_USERNAME: sa
      DB_PASSWORD: sa

  # React Frontend
  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - laravel_network
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local